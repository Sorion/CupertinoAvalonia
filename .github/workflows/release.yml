name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::The tag $GITHUB_REF_NAME isn't a version (expected v1.2.3 or v1.2.3-preview.1)."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build
        run: dotnet build CupertinoAvalonia.slnx -c Release -p:Version=$VERSION

      - name: Test
        run: dotnet test tests/CupertinoAvalonia.Tests -c Release --no-build

      - name: Pack
        run: dotnet pack src/CupertinoAvalonia -c Release --no-build -p:Version=$VERSION -o artifacts

      # The temporary key lasts an hour: get it just before pushing.
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      # Pushes the symbols (.snupkg) along with the package.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "artifacts/CupertinoAvalonia.$VERSION.nupkg" --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json --skip-duplicate
