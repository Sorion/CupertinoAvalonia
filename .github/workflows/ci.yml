name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS is the target; Windows and Linux check what the theme does elsewhere, macOS-only tests skipped.
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CupertinoAvalonia.slnx -c Release -warnaserror

      - name: Test
        run: dotnet test tests/CupertinoAvalonia.Tests -c Release --no-build

      # Checks that the package builds; nothing is uploaded.
      - name: Pack
        if: matrix.os == 'macos-latest'
        run: dotnet pack src/CupertinoAvalonia -c Release --no-build -o artifacts
