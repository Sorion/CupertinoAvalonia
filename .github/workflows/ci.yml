name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build CupertinoAvalonia.slnx -c Release

      - name: Test
        run: dotnet test tests/CupertinoAvalonia.Tests -c Release --no-build

      # Checks that the package builds; nothing is uploaded.
      - name: Pack
        run: dotnet pack src/CupertinoAvalonia -c Release --no-build -o artifacts
